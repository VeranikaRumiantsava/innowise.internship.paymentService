services:
  # ---------- PAYMENT SERVICE ----------
  paymentservice:
    build:
      context: .
      dockerfile: Dockerfile
    image: payment_service:latest
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      mongodb_paymentservice:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb_paymentservice
      MONGO_PORT: 27017
      MONGO_DB: payments
      MONGO_USER: root
      MONGO_PASS: example
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - app_network

  # ---------- MONGODB ----------
  mongodb_paymentservice:
    image: mongo:7.0
    container_name: payment-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data_payment:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username root --password example --eval 'db.adminCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - app_network

  # ---------- ZOOKEEPER ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app_network

  # ---------- KAFKA ----------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network


volumes:
  mongo_data_payment:

networks:
  app_network:
    external: true
