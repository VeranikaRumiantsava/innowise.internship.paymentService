name: CI Pipeline (payment-service)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build (skip tests)
        run: mvn -B -V -DskipTests package

      - name: Upload built artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: target/*.jar

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Docker info (verify Docker available for Testcontainers)
        run: docker version && docker info

      - name: Force-resolve test dependencies (ensure test-scope jars present)
        run: mvn -U -B -DskipTests dependency:resolve

      - name: Show test-scope dependency tree
        run: mvn -q -DskipTests dependency:tree -Dscope=test

      - name: List spring-boot-testcontainers jar in local repo
        run: ls -la ~/.m2/repository/org/springframework/boot/spring-boot-testcontainers || true

      - name: Compile tests (populate test classpath)
        run: mvn -DskipTests test-compile

      - name: Run unit tests
        run: mvn -B -V test

      - name: Archive test reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: verdeth/paymentservice:latest
