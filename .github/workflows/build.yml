name: CI Pipeline (payment-service)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build (skip tests)
        run: mvn -B -V -DskipTests package

  test:
    runs-on: ubuntu-latest
    needs: build

    env:
      SPRING_DATA_MONGODB_HOST: 127.0.0.1
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      RANDOM_CLIENT_URL: http://127.0.0.1:8081

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker & Runner diagnostics
        run: |
          echo "Runner architecture: $(uname -m)"
          docker version || true
          docker info || true
          # Try to pull the Confluent images for amd64 explicitly to reveal platform issues early
          docker pull --platform linux/amd64 confluentinc/cp-zookeeper:7.4.0 || true
          docker pull --platform linux/amd64 confluentinc/cp-kafka:7.4.0 || true

      - name: Start Zookeeper (amd64)
        run: |
          docker run -d --name zookeeper --platform linux/amd64 \
            -e ZOOKEEPER_CLIENT_PORT=2181 -e ZOOKEEPER_TICK_TIME=2000 \
            -p 2181:2181 \
            confluentinc/cp-zookeeper:7.4.0
          echo "Zookeeper container started."

      - name: Start Confluent Kafka (amd64)
        run: |
          docker run -d --name kafka --platform linux/amd64 --link zookeeper \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181 \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -p 9092:9092 \
            confluentinc/cp-kafka:7.4.0
          echo "Kafka container started."

      - name: Wait for MongoDB & Kafka to be ready
        run: |
          echo "Waiting for MongoDB (container from services) and Kafka to be reachable..."
          # Wait for Mongo (service started by GitHub job? we will check port anyway)
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 27017 && echo "Mongo port open" && break
            echo "Waiting for Mongo ($i/60)..."
            sleep 1
          done

          # Wait for Kafka broker API to respond
          for i in $(seq 1 60); do
            echo "Checking Kafka readiness ($i/60)..."
            # Try kafka-broker-api-versions inside the container
            if docker exec kafka bash -c "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092" >/dev/null 2>&1; then
              echo "Kafka is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Kafka did not start in time. Dumping logs:" >&2
          docker logs kafka || true
          exit 1

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies (again for this job)
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests
        run: mvn -B -V test \
          -Dspring.data.mongodb.host=127.0.0.1 \
          -Dspring.data.mongodb.port=27017 \
          -Dspring.kafka.bootstrap-servers=127.0.0.1:9092

      - name: Run integration tests (verify)
        run: mvn -B -V verify \
          -Dspring.data.mongodb.host=127.0.0.1 \
          -Dspring.data.mongodb.port=27017 \
          -Dspring.kafka.bootstrap-servers=127.0.0.1:9092

      - name: Show Kafka topics (debug)
        if: failure() || always()
        run: |
          echo "Topics list (if kafka alive):"
          docker exec kafka bash -c "kafka-topics --bootstrap-server 127.0.0.1:9092 --list" || true
          docker logs kafka || true

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: verdeth/paymentservice:latest
