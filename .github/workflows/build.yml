name: CI Pipeline (payment-service)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build (skip tests)
        run: mvn -B -V -DskipTests package

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd "echo ruok | nc -w 1 localhost 2181 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: confluentinc/cp-kafka:7.4.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Mongo, Zookeeper and Kafka..."
          for i in {1..60}; do
            nc -z 127.0.0.1 27017 && \
            nc -z 127.0.0.1 2181 && \
            nc -z 127.0.0.1 9092 && echo "All services up" && exit 0
            echo "waiting... ($i)"
            sleep 2
          done
          echo "services did not start in time" >&2
          exit 1

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests
        env:
          SPRING_DATA_MONGODB_HOST: 127.0.0.1
          SPRING_DATA_MONGODB_PORT: 27017
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          RANDOM_CLIENT_URL: http://127.0.0.1:8081
        run: mvn -B -V test -Dspring.data.mongodb.host=127.0.0.1 -Dspring.data.mongodb.port=27017 -Dspring.kafka.bootstrap-servers=127.0.0.1:9092

      - name: Run integration tests (verify)
        env:
          SPRING_DATA_MONGODB_HOST: 127.0.0.1
          SPRING_DATA_MONGODB_PORT: 27017
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          RANDOM_CLIENT_URL: http://127.0.0.1:8081
        run: mvn -B -V verify -Dspring.data.mongodb.host=127.0.0.1 -Dspring.data.mongodb.port=27017 -Dspring.kafka.bootstrap-servers=127.0.0.1:9092

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: verdeth/paymentservice:latest
